name: "Simple Build"

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - DevBuild
          - Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout with YRpp only
        uses: actions/checkout@v4
        with:
          submodules: false
          
      - name: Clone YRpp manually
        run: |
          git clone https://github.com/Phobos-developers/YRpp.git YRpp
          echo "YRpp cloned successfully"
          dir YRpp
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          msbuild /m /p:Configuration=${{ github.event.inputs.build-type }} /p:GitCommit=${{ github.sha }} /p:GitBranch=${{ github.ref }} /v:minimal Spawner.vcxproj
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CnCNet-Spawner-${{ github.event.inputs.build-type }}-${{ github.sha }}
          path: |
            LICENSE.md
            ${{ github.event.inputs.build-type }}/CnCNet-Spawner.dll
            ${{ github.event.inputs.build-type }}/CnCNet-Spawner.pdb
