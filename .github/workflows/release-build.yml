name: "Manual Release Build"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'manual-build'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout main repo without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          
      - name: Clone YRpp manually
        run: |
          git clone https://github.com/CnCNet/yrpp-spawner YRpp
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Build Release
        uses: ./.github/actions/build
        with:
          build-config: Release

      - name: Create Archive
        run: |
          7z a CnCNet-Spawner-${{ github.event.inputs.version }}.zip ^
          ./LICENSE.md ^
          ./Release/CnCNet-Spawner.dll ^
          ./Release/CnCNet-Spawner.pdb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CnCNet-Spawner-${{ github.event.inputs.version }}
          path: CnCNet-Spawner-${{ github.event.inputs.version }}.zip
